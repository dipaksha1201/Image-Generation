CONFIG_NAME: 'image_gen'

DATASET_NAME: 'birds'
DATA_DIR: 'data'
GPU_ID: 0
CUDA: True

TRAIN:
    FLAG: False
    NET_G: ''  # Path to generator model will be set via command line
    NET_E: ''  # Path to text encoder will be set via command line
    BATCH_SIZE: 8
    MAX_EPOCH: 600
    SNAPSHOT_INTERVAL: 50
    DISCRIMINATOR_LR: 0.0002
    GENERATOR_LR: 0.0002
    COEFF:
        KL: 2.0

GAN:
    Z_DIM: 100
    CONDITION_DIM: 100
    R_NUM: 2
    B_ATTENTION: True
    B_DCGAN: False

TEXT:
    EMBEDDING_DIM: 256
    CAPTIONS_PER_IMAGE: 10
    WORDS_NUM: 18

TREE:
    BRANCH_NUM: 3
    BASE_SIZE: 64

STAGE1:
    G_GF_DIM: 128
    G_DF_DIM: 64
    D_DF_DIM: 64
    D_GF_DIM: 128
    RATIO: 0.5

STAGE2:
    G_GF_DIM: 128
    G_DF_DIM: 64
    D_DF_DIM: 64
    D_GF_DIM: 128
    RATIO: 0.5

STAGE3:
    G_GF_DIM: 128
    G_DF_DIM: 64
    D_DF_DIM: 64
    D_GF_DIM: 128
    RATIO: 0.5
